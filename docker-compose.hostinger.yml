services:
  web:
    image: ghcr.io/pdpablo/spook-shack-v2:${SPOOK_SHACK_V2_IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.spook-shack-v2.rule=Host(`spook-shack.com`) || Host(`www.spook-shack.com`)
      - traefik.http.routers.spook-shack-v2.entrypoints=websecure
      - traefik.http.routers.spook-shack-v2.tls.certresolver=letsencrypt
      - traefik.http.services.spook-shack-v2.loadbalancer.server.port=8080
    environment:
      PORT: 8080
      SPOOK_SHACK_DEMO_PASSWORD: ${SPOOK_SHACK_DEMO_PASSWORD:-SpookShack123!}
    volumes:
      - spook-shack-data:/app/data

volumes:
  spook-shack-data:
